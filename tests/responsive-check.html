<script>window.errors=[];window.addEventListener('error',e=>errors.push(e.message));var uniqueId='debugTests',condition=0,adServerLoc='/complete',mode='debug',codeversion='test';var records=[],completed=false,saveCalls=0;function PsiTurk(){this.recordTrialData=r=>records.push(r);this.getTrialData=()=>[];this.saveData=c=>{saveCalls++;c.success();};this.completeHIT=()=>completed=true;}</script>
<script src="/static/lib/jquery-3.4.1.min.js"></script><script>$.ajax=()=>{};</script>
<script src="/static/js/settings.js"></script><script src="/static/js/stimuli.js"></script><script src="/static/js/questionnaires.js"></script><script src="/static/js/trial.js"></script><script src="/static/js/task.js"></script><script src="/static/js/flow.js"></script><script src="/static/js/viewport.js" defer></script><link rel="stylesheet" href="/static/css/responsive.css">
<script>$(async function(){const pause=()=>new Promise(r=>setTimeout(r,70));const assert=(x,m)=>{if(!x)throw Error(m);};const fit=()=>assert(document.documentElement.scrollHeight<=innerHeight+2&&document.documentElement.scrollWidth<=innerWidth+2,'overflow '+document.documentElement.scrollHeight+'x'+document.documentElement.scrollWidth);
try{await pause();HRI.demographics();const age=document.querySelector('[name=age]');age.value='16';age.dispatchEvent(new Event('input',{bubbles:true}));assert(age.getAttribute('aria-invalid')==='true','age flagged');assert(document.getElementById('error-age').textContent.includes('18 to 80'),'age help');age.value='25';age.dispatchEvent(new Event('input',{bubbles:true}));assert(document.getElementById('error-age').hidden,'age clears');await pause();fit();
let pages=matchMedia('(max-width:600px)').matches?10:8;for(let i=0;i<pages;i++){HRI.instructions(i);await pause();fit();}
let received;HRI.ratingPage('Your view of Pepper',HRI.mdmtItems.map(([k,v])=>['mdmt_'+k,v]),[...Array.from({length:8},(_,i)=>[i,String(i)]),['does_not_fit','Does Not Fit']],'0 = Not at all; 7 = Very. Choose Does Not Fit if it does not apply.',v=>received=v);await pause();fit();const form=document.getElementById('ratings');assert(form.querySelector('button').disabled,'required');if(matchMedia('(max-width:600px)').matches){form.querySelectorAll('select').forEach(x=>{assert(!x.disabled,'select active');x.value='0';x.dispatchEvent(new Event('change',{bubbles:true}));});}else{form.querySelectorAll('input[value="0"]').forEach(x=>x.click());}assert(!form.querySelector('button').disabled,'all complete');form.querySelector('button').click();assert(Object.values(received).length===8&&Object.values(received).every(v=>v===0),'same scoring');
HRI.startTask();await pause();fit();document.getElementById('manual').click();await pause();assert(document.getElementById('manual-time').getBoundingClientRect().height>0,'manual clock');HRI.expiring=true;HRI.abortTrial();clearInterval(HRI.overallInterval);window.removeEventListener('beforeunload',HRI.warnUnsaved);document.body.innerHTML='<pre id=result>PASS responsive pages, age errors, survey values and manual clock '+innerWidth+'x'+innerHeight+'</pre>';
}catch(e){clearInterval(HRI.overallInterval);document.body.innerHTML='<pre id=result>FAIL '+e.stack+'</pre>';}});</script>
