<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/viewport.css"><link rel="stylesheet" href="/static/css/responsive.css">
<script>window.errors=[];window.addEventListener('error',e=>errors.push(e.message));var uniqueId='debugTests',condition=0,adServerLoc='/complete',mode='debug',codeversion='test';var records=[],completed=false,saveCalls=0;function PsiTurk(){this.recordTrialData=r=>records.push(r);this.getTrialData=()=>[];this.saveData=c=>{saveCalls++;c.success();};this.completeHIT=()=>completed=true;}</script>
<script src="/static/lib/jquery-3.4.1.min.js"></script><script>$.ajax=()=>{};</script>
<script src="/static/js/settings.js"></script><script src="/static/js/stimuli.js"></script><script src="/static/js/questionnaires.js"></script><script src="/static/js/trial.js"></script><script src="/static/js/task.js"></script><script src="/static/js/flow.js"></script><script src="/static/js/viewport.js" defer></script>
<script>
$(async function(){const assert=(x,m)=>{if(!x)throw Error(m);};const pause=()=>new Promise(r=>setTimeout(r,50));
try{
 await pause();HRI.validate();assert(HRI.config.practiceTrials===0,'no practice');assert(HRI.config.trialTimeLimitMs===12000,'12 second trial');
 for(const c of HRI.config.conditions){HRI.recoveryCondition=c;HRI.showVideo();assert(document.querySelector('video').getAttribute('src').includes({acknowledgment:'Acknowledge',apology:'Apology',apology_explanation:'ApologyExplanation'}[c]),'assigned video');HRI.instructions(6);assert(document.querySelector('.guide-image').src.includes(c+'.png'),'assigned instruction image');}
 HRI.recoveryCondition='acknowledgment';HRI.demographics();const f=document.querySelector('form');const submit=f.querySelector('button');assert(submit.disabled,'required empty demographics');f.elements.age.value=81;assert(!f.elements.age.checkValidity(),'age 81 blocked');f.elements.age.value=18;f.elements.gender.value='Other';f.elements.gender.dispatchEvent(new Event('change',{bubbles:true}));assert(f.elements.gender_other.required,'other required');f.elements.gender_other.value=' ';assert(!f.elements.gender_other.checkValidity(),'whitespace blocked');f.elements.gender_other.value='Self described';f.elements.robot_experience.value='A little';f.elements.psiturk_experience.value='None';f.dispatchEvent(new Event('input',{bubbles:true}));assert(!submit.disabled,'completed demographics enabled');submit.click();assert(records.find(r=>r.record_type==='demographics').age===18,'numeric age');assert(document.getElementById('intro-video'),'video follows demographics');document.getElementById('skip').click();assert(document.querySelector('.guide-page'),'instructions follow video');
 for(let i=0;i<8;i++){HRI.instructions(i);await pause();assert(document.documentElement.scrollHeight<=innerHeight+2,'instruction fits '+i);if(i){document.getElementById('previous').click();assert(document.querySelector('.eyebrow').textContent.includes(i+' /'),'previous instruction');}}
 let answers;
 HRI.ratingPage('Your view of Pepper',HRI.mdmtItems.map(([k,v])=>['mdmt_'+k,v]),[...Array.from({length:8},(_,i)=>[i,String(i)]),['does_not_fit','Does Not Fit']],'0 = Not at all; 7 = Very.',v=>answers=v);
 await pause();assert(document.documentElement.scrollHeight<=innerHeight+2,'single-page survey fits');assert(document.querySelectorAll('input[value="does_not_fit"]').length===8,'eight MDMT rows');document.querySelectorAll('input[value="does_not_fit"]').forEach(x=>x.click());document.querySelector('#ratings [type=submit]').click();assert(Object.values(answers).every(v=>v===null),'Does Not Fit remains missing');
 HRI.startTask();
 function ratings(){while(document.getElementById('ratings')){const form=document.getElementById('ratings');const button=form.querySelector('[type=submit]');assert(button.disabled,'rating required');const names=[...new Set([...form.querySelectorAll('input')].map(x=>x.name))];for(const name of names)form.querySelector('[name="'+name+'"][value="4"]').click();assert(!button.disabled,'all rows enable Continue');button.click();}}

 for(let n=1;n<=15;n++){
  const t=HRI.makeTrial(uniqueId,n<=4?'build_trust':n<=11?'errors_recovery':'continued_interaction',n);
  assert(t.robot_correct===![5,8,11].includes(n),'error schedule');assert(document.getElementById('overall-time'),'clock visible');
  if(n===1){document.getElementById('manual').click();assert(!document.getElementById('rack').hidden,'manual opens');assert(document.getElementById('overall-time'),'clock during manual');document.getElementById('back-bottom').click();}
  const before=document.querySelector('.task-action-area').getBoundingClientRect().top;
  document.querySelector('[data-choice="'+t.correct_section+'"]').click();
  const after=document.querySelector('.task-action-area').getBoundingClientRect().top;assert(Math.abs(after-before)<3,'stable action area');
  document.getElementById('continue').click();
  if(n===4||n===7||n===15)ratings();
 }
 const trials=records.filter(r=>r.record_type==='trial');assert(trials.length===15,'15 trials');assert(records.filter(r=>r.record_type==='trust').map(r=>r.checkpoint).join(',')==='pre_error,early_recovery,final','trust timing');assert(saveCalls===0,'no early saves');
 // Workload may have been completed by ratings() above; optional feedback follows.
 assert(document.getElementById('feedback'),'final feedback');document.getElementById('feedback').querySelector('button').click();document.getElementById('continue').click();document.getElementById('submit-responses').click();assert(saveCalls===1&&completed,'submit saves exactly once');
 HRI.startTask();HRI.deadline=Date.now()-1;await new Promise(r=>setTimeout(r,150));assert(!HRI.deadline&&!HRI.abortTrial,'timeout stops clocks');assert(document.getElementById('ratings'),'timeout final questionnaire');assert(records.filter(r=>r.record_type==='trial').at(-1).timed_out,'timeout records active trial');
 let trialResult;const realNow=performance.now.bind(performance);let fakeNow=0;Object.defineProperty(performance,'now',{configurable:true,value:()=>fakeNow});
 HRI.runTrial(HRI.makeTrial(uniqueId,'build_trust',1),r=>trialResult=r);fakeNow=12001;document.querySelector('[data-choice]').click();assert(trialResult.timed_out&&trialResult.participant_choice===null,'12 second deadline rejects late choice');Object.defineProperty(performance,'now',{configurable:true,value:realNow});
 assert(errors.length===0,errors.join(';'));window.removeEventListener('beforeunload',HRI.warnUnsaved);document.body.innerHTML='<pre id="result">PASS: assigned media, demographics, navigation, viewport, 15 trials, checkpoints, clocks, submission and timeout</pre>';
}catch(e){clearInterval(HRI.overallInterval);if(HRI.abortTrial){HRI.expiring=true;HRI.abortTrial();}document.body.innerHTML='<pre id="result">FAIL: '+e.stack+' ERRORS '+errors.join(';')+'</pre>';}
});
</script>
