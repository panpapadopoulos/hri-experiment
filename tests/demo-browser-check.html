<!doctype html><meta charset="utf-8"><iframe id="run" width="1200" height="760"></iframe><script>
(async()=>{const frame=document.getElementById('run'),assert=(x,m)=>{if(!x)throw Error(m);};const loaded=()=>new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));const pause=()=>new Promise(r=>setTimeout(r,50));let calls=[];
try{
 let wait=loaded();frame.src='index.html';await wait;assert(frame.contentDocument.querySelector('#video-entry'),'welcome');wait=loaded();frame.contentDocument.querySelector('#video-entry').click();await wait;assert(frame.contentDocument.querySelector('#consent-form'),'consent');frame.contentDocument.querySelector('#consent-agreement').click();wait=loaded();frame.contentDocument.querySelector('#consent-continue').click();await wait;await pause();
 const w=frame.contentWindow;const d=()=>frame.contentDocument;
 w.XMLHttpRequest.prototype.open=function(method,url){calls.push([method,url]);throw Error('Unexpected data request');};w.fetch=()=>{calls.push('fetch');throw Error('Unexpected fetch');};
 assert(w.condition>=0&&w.condition<=2,'automatic condition');assert(d().getElementById('demographics'),'demographics');let form=d().getElementById('demographics');form.elements.age.value='25';form.elements.gender.value='Prefer not to say';form.elements.robot_experience.value='None';form.elements.psiturk_experience.value='None';form.dispatchEvent(new w.Event('input',{bubbles:true}));form.querySelector('button').click();assert(d().querySelector('video'),'video');d().getElementById('skip').click();
 while(d().querySelector('.guide-page'))d().getElementById('next').click();
 function ratings(){while(d().getElementById('ratings')){let f=d().getElementById('ratings');f.querySelectorAll('input[value="4"]:not(:disabled)').forEach(x=>x.click());f.querySelectorAll('select:not(:disabled)').forEach(x=>{x.value='4';x.dispatchEvent(new w.Event('change',{bubbles:true}));});f.querySelector('[type=submit]').click();}}
 for(let n=1;n<=15;n++){assert(d().querySelector('[data-choice]'),'trial '+n);d().querySelector('[data-choice]').click();d().getElementById('continue').click();if([4,7,15].includes(n))ratings();}
 d().getElementById('feedback').querySelector('button').click();d().getElementById('continue').click();assert(d().body.textContent.includes('This was a demo run, not an actual experiment.'),'submit notice');assert(w.psiTurk.getTrialData().length===0,'no trial records stored');assert(calls.length===0,'no data requests');assert(!w.localStorage.length&&!w.sessionStorage.length,'no browser storage');wait=loaded();d().getElementById('submit-responses').click();await wait;assert(d().body.textContent.includes('Your answers will not be recorded'),'completion notice');assert(d().querySelector('form').getAttribute('action')==='index.html','restart demo');document.body.innerHTML='<pre id="result">PASS: real demo landing, consent, demographics, video, instructions, 15 trials, surveys, Submit and completion; no response transport or storage.</pre>';
}catch(e){document.body.innerHTML='<pre id="result">FAIL '+e.stack+'</pre>';}
})();</script>
